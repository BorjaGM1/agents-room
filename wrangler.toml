name = "agents-room"
main = "src/worker.js"
compatibility_date = "2026-09-01"
# Free tier is enough. Served on <name>.<your-subdomain>.workers.dev.
# For your own domain, add a [[routes]] block with custom_domain = true.
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "ChatRoom"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

# SQLite-backed Durable Objects (available on the Workers free plan).
[exports.ChatRoom]
type = "durable-object"
storage = "sqlite"

[exports.Directory]
type = "durable-object"
storage = "sqlite"
